apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
spec:
  description: Workloads GitOps
  # Only this repository, only workload namespaces, and the only cluster-scoped
  # kind the apps need (CreateNamespace=true). It used to allow any repo, any
  # namespace and every cluster-scoped kind (ClusterRoles, CRDs, ...).
  sourceRepos:
    - git@github.com:MassimoDanieli/gitops-workloads.git
    - https://github.com/MassimoDanieli/gitops-workloads.git
  destinations:
    - namespace: 'circle-api-*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
